services:
  postgres:
    image: postgres:17
    container_name: cwm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloud_workspace_manager
      POSTGRES_USER: cloudworkspace_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudworkspace_app"]

  backend:
    build:
      context: ./backend
    container_name: cwm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}

      PROMETHEUS_URL: ${PROMETHEUS_URL}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock 

  frontend:
    build:
      context: ./frontend
    container_name: cwm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4173:4173"

  nginx:
    build:
      context: ./nginx
    container_name: cwm-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"

  prometheus:
    image: prom/prometheus:latest
    container_name: cwm-prometheus

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: cwm-grafana

    restart: unless-stopped

    depends_on:
      - prometheus

    ports:
      - "3001:3000"

    volumes:
      - grafana_data:/var/lib/grafana

  node-exporter:
    image: prom/node-exporter:latest
    container_name: cwm-node-exporter

    restart: unless-stopped

    ports:
      - "9100:9100"

    pid: host

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"

volumes:
  postgres_data:
  grafana_data: